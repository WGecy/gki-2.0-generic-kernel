# ============================================================================
#  GKI 2.0 内核构建流程 —— BakaSU + fusebpf + SUSFS + ADIOS + Unicode 绕过
# ----------------------------------------------------------------------------
#  流程:
#    1. 准备环境 (磁盘清理 + 编译依赖)
#    2. 拉取 ACK 基线 (android15-6.6 @ baseline_commit)
#    3. git am patches/*.patch 打上 84 个 GKI 定制补丁
#    4. 准备 clang-19 / lld-19 / llvm-19 + AOSP build-tools (pahole 等)
#    5. scripts/ci-integrate.sh 集成 BakaSU(Built-In 内建 CONFIG_KSU=y) + fusebpf + SUSFS + ADIOS + Unicode
#    6. 生成 defconfig 并校验配置项
#    7. 编译 Image 并校验产物 (版本串 / KSU / SUSFS / ADIOS / fusebpf)
#    8. 用 third_party/AnyKernel3 打包成可直刷的 zip
#    9. 上传 Image + AnyKernel3 zip + kernel.release + build-info.txt 作为 artifact
#
#  说明: 本工作流只编译 + 打包, 刻意不创建 Release、不构建 KernelSU 管理器。
#        fusebpf / Unicode 绕过补丁均来自 third_party/, 在 ci-integrate.sh 里于编译前应用。
# ============================================================================
name: 内核构建流程 (GKI 2.0 BakaSU + fusebpf + SUSFS + ADIOS + Unicode)

on:
  workflow_call:
    inputs:
      android_version:
        description: 'Android 版本 (android15)'
        required: true
        type: string
      kernel_version:
        description: '内核版本 (6.6)'
        required: true
        type: string
      sub_level:
        description: '子版本号 (158)'
        required: true
        type: string
      snapshot:
        description: '基线快照 (2026-09)'
        required: true
        type: string
      baseline_commit:
        description: 'ACK 基线 commit'
        required: true
        type: string
      ksu_repo:
        description: 'KernelSU 仓库'
        required: false
        type: string
        default: 'https://github.com/WGecy/BakaSU'
      ksu_branch:
        description: 'KernelSU 分支/标签'
        required: false
        type: string
        default: 'main'
      susfs_repo:
        description: 'SUSFS 仓库'
        required: false
        type: string
        default: 'https://gitlab.com/simonpunk/susfs4ksu.git'
      susfs_branch:
        description: 'SUSFS 分支'
        required: false
        type: string
        default: 'gki-android15-6.6'
      susfs_pin:
        description: 'SUSFS 固定提交 (留空 = 跟随 susfs_branch)'
        required: false
        type: string
        default: '93114563fd6b08092b9ce8c0309738c921ac8bd1'
      adios_lock:
        description: 'ADIOS 运行时切换拦截: off | cpq | all'
        required: false
        type: string
        default: 'off'
      custom_suffix:
        description: '额外版本后缀 (拼在 -android15-8 之后, -4k 之前)'
        required: false
        type: string
        default: ''
      build_time:
        description: '固定编译时间戳 (留 N 表示使用当前时间)'
        required: false
        type: string
        default: 'N'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GKI_ROOT: ${{ github.workspace }}/gki-kernel
  BASELINE_REPO: https://android.googlesource.com/kernel/common
  BASELINE_BRANCH: android15-6.6
  BUILD_TOOLS_REPO: https://android.googlesource.com/kernel/prebuilts/build-tools
  TOOLCHAIN_BRANCH: main-kernel-build-2024
  LLVM_BIN: /usr/lib/llvm-19/bin

jobs:
  build-kernel:
    name: 编译内核 (${{ inputs.kernel_version }}${{ inputs.sub_level }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 构建信息摘要
        shell: bash
        run: |
          echo "====================================================="
          echo " Android 版本 : ${{ inputs.android_version }}"
          echo " 内核版本     : ${{ inputs.kernel_version }}"
          echo " 子版本号     : ${{ inputs.sub_level }}"
          echo " 基线快照     : ${{ inputs.snapshot }}"
          echo " 基线 commit  : ${{ inputs.baseline_commit }}"
          echo " 工具链       : clang-19 / lld-19 / llvm-19 (apt)"
          echo " KernelSU     : ${{ inputs.ksu_repo }} @ ${{ inputs.ksu_branch }}"
          echo " SUSFS        : ${{ inputs.susfs_repo }} @ ${{ inputs.susfs_pin || inputs.susfs_branch }}"
          echo " ADIOS 拦截   : ${{ inputs.adios_lock }}"
          echo " 额外后缀     : '${{ inputs.custom_suffix }}'"
          echo "====================================================="

      - name: 释放磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true

      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 安装编译依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev zlib1g-dev \
            python3 git curl wget zip unzip xz-utils cpio rsync patch jq
          for t in make zip patch jq strings nm find xargs; do
            command -v "$t" >/dev/null || { echo "::error::缺少工具 $t"; exit 1; }
          done

      - name: 拉取 ACK 基线
        shell: bash
        env:
          COMMIT: ${{ inputs.baseline_commit }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -euo pipefail
          mkdir -p "$GKI_ROOT/common"
          cd "$GKI_ROOT/common"
          git init -q
          git remote add origin "$BASELINE_REPO" 2>/dev/null || git remote set-url origin "$BASELINE_REPO"
          if ! git fetch --depth 1 origin "$COMMIT"; then
            echo "::warning::无法直接抓取 $COMMIT, 回退到分支浅克隆"
            SINCE="$(date -u -d "${SNAPSHOT}-01 -30 days" +%Y-%m-%d)"
            git fetch --shallow-since="$SINCE" origin "$BASELINE_BRANCH"
          fi
          git checkout -q "$COMMIT"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$COMMIT" ]; then
            echo "::error::基线 commit 不匹配: 期望 $COMMIT, 实际 $HEAD_SHA"
            exit 1
          fi
          echo "基线已就绪: $HEAD_SHA"

      - name: 应用内核补丁 (git am)
        shell: bash
        run: |
          set -euo pipefail
          cd "$GKI_ROOT/common"
          git config user.email 'gki-ci@localhost'
          git config user.name 'gki-ci'
          if ! git am "$GITHUB_WORKSPACE"/patches/*.patch; then
            echo "::error::补丁应用失败"
            git am --abort || true
            exit 1
          fi
          echo "已应用 $(git rev-list --count HEAD) 个提交"

      - name: 缓存 build-tools
        uses: actions/cache@v5
        with:
          path: gki-kernel/kbt
          key: gki-buildtools-${{ env.TOOLCHAIN_BRANCH }}-v1

      - name: 准备工具链 (clang-19 + build-tools)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 llvm-19
          # 让 clang/lld 默认解析到 19: 内核构建里的 cc-option、toolchain 探测都直接调用 `clang`
          for pair in 'clang clang-19' 'clang++ clang++-19' 'ld.lld ld.lld-19' 'llvm-ar llvm-ar-19'; do
            set -- $pair
            sudo update-alternatives --install /usr/bin/$1 $1 /usr/bin/$2 100 || true
          done
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-strip llvm-ranlib llvm-profdata; do
            [ -x "$LLVM_BIN/$t" ] || { echo "::error::缺少 $LLVM_BIN/$t"; exit 1; }
          done
          if [ ! -d "$GKI_ROOT/kbt/linux-x86/bin" ]; then
            rm -rf "$GKI_ROOT/kbt"
            git clone --depth 1 --filter=blob:none --sparse \
              -b "$TOOLCHAIN_BRANCH" "$BUILD_TOOLS_REPO" "$GKI_ROOT/kbt"
            git -C "$GKI_ROOT/kbt" sparse-checkout set linux-x86/bin linux-x86/lib64
          fi
          [ -x "$GKI_ROOT/kbt/linux-x86/bin/pahole" ] || { echo "::error::缺少 pahole"; exit 1; }
          {
            echo "PATH=$LLVM_BIN:$GKI_ROOT/kbt/linux-x86/bin:$PATH"
            echo "LD_LIBRARY_PATH=$GKI_ROOT/kbt/linux-x86/lib64"
            echo "CLANG_AUTOFDO_PROFILE=$GKI_ROOT/common/android/gki/aarch64/afdo/kernel.afdo"
          } >> "$GITHUB_ENV"
          "$LLVM_BIN/clang" --version | head -n1
          "$LLVM_BIN/ld.lld" --version
          "$GKI_ROOT/kbt/linux-x86/bin/pahole" --version

      - name: 集成内核特性 (BakaSU + fusebpf + SUSFS + ADIOS + Unicode)
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci-integrate.sh" \
            --gki-root "$GKI_ROOT" \
            --workspace "$GITHUB_WORKSPACE" \
            --android-version "${{ inputs.android_version }}" \
            --kernel-version "${{ inputs.kernel_version }}" \
            --ksu-repo "${{ inputs.ksu_repo }}" \
            --ksu-branch "${{ inputs.ksu_branch }}" \
            --susfs-repo "${{ inputs.susfs_repo }}" \
            --susfs-branch "${{ inputs.susfs_branch }}" \
            --susfs-pin "${{ inputs.susfs_pin }}" \
            --adios-lock "${{ inputs.adios_lock }}"

      - name: 生成并校验 defconfig
        shell: bash
        working-directory: gki-kernel/common
        run: |
          set -euo pipefail
          # custom_suffix 只能改 defconfig 里的 CONFIG_LOCALVERSION, 让它落在 -4k 之前。
          # 绝不能通过 make 的 LOCALVERSION 传: setlocalversion 会把两者拼起来, 版本串会重复。
          CUSTOM_SUFFIX="${{ inputs.custom_suffix }}"
          if [ -n "$CUSTOM_SUFFIX" ]; then
            DEFCFG=arch/arm64/configs/gki_defconfig
            grep -q '^CONFIG_LOCALVERSION=' "$DEFCFG" \
              || { echo '::error::gki_defconfig 里没有 CONFIG_LOCALVERSION 行 (patch 0002 未生效?)'; exit 1; }
            sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"-android15-8${CUSTOM_SUFFIX}-4k\"|" "$DEFCFG"
            grep '^CONFIG_LOCALVERSION=' "$DEFCFG"
          fi
          make O=out ARCH=arm64 LLVM=1 LOCALVERSION= \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ gki_defconfig
          CONF=out/.config
          grep '^CONFIG_LOCALVERSION=' "$CONF" || { echo '::error::defconfig 缺少 CONFIG_LOCALVERSION'; exit 1; }
          for c in CONFIG_KSU=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                   CONFIG_MQ_IOSCHED_ADIOS=y CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y \
                   CONFIG_UNICODE=y CONFIG_FUSE_BPF=y; do
            grep -q "^$c$" "$CONF" || { echo "::error::defconfig 缺少 $c"; exit 1; }
          done
          grep -q 'GKI-ADIOS-DEFAULT-BEGIN' block/elevator.c || { echo '::error::ADIOS 默认调度器注入丢失'; exit 1; }
          if [ "${{ inputs.adios_lock }}" = 'off' ]; then
            if grep -qF 'GKI-ADIOS-LOCK-BEGIN' block/elevator.c; then
              echo '::error::adios_lock=off 但存在切换拦截块'; exit 1
            fi
          else
            grep -qF 'GKI-ADIOS-LOCK-BEGIN' block/elevator.c || { echo '::error::缺少 ADIOS 切换拦截块'; exit 1; }
          fi
          [ -f block/adios.c ] || { echo '::error::block/adios.c 缺失'; exit 1; }
          # BakaSU 内建集成: drivers/kernelsu 必须是指向 BakaSU/kernel 的有效软链接,
          # 并且 kernel/Kbuild 里确实有 obj-$(CONFIG_KSU) += kernelsu.o (内建编进 vmlinux 的前提)。
          # 注意: 上游 BakaSU 已移除 NoMount (kernel/nomount/ 不存在), 这里不再断言它。
          [ -f drivers/kernelsu/Kbuild ] || { echo '::error::drivers/kernelsu/Kbuild 缺失 (内建集成未生效)'; exit 1; }
          [ -f drivers/kernelsu/Kconfig ] || { echo '::error::drivers/kernelsu/Kconfig 缺失'; exit 1; }
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu.o' drivers/kernelsu/Kbuild \
            || { echo '::error::drivers/kernelsu/Kbuild 没有 obj-$(CONFIG_KSU) += kernelsu.o'; exit 1; }
          grep -qF 'drivers/kernelsu/Kconfig' drivers/Kconfig \
            || { echo '::error::drivers/Kconfig 未 source drivers/kernelsu/Kconfig'; exit 1; }
          grep -qx 'CONFIG_KSU=y' "$CONF" || { echo '::error::CONFIG_KSU 不是内建 (=y)'; exit 1; }
          # 钩子方式是 BakaSU Kconfig 里的 choice (三选一, 互斥): .config 里只会出现被选中的那一个,
          # 未选中的不会以 "# ... is not set" 形式出现, 所以这里按"恰好命中一个"来校验。
          if grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$CONF"; then
            echo '::error::CONFIG_KSU_MANUAL_HOOK 被打开 (那是 non-GKI 手工 hook, 缺 hook 会编译失败)'; exit 1
          fi
          HOOK_SEL="$(grep -cE '^CONFIG_KSU_(TRACEPOINT_HOOK|MANUAL_HOOK|SUSFS)=y$' "$CONF" || true)"
          [ "$HOOK_SEL" = 1 ] \
            || { echo "::error::KSU 钩子方式应恰好选中一种, 实际 $HOOK_SEL 种"; exit 1; }
          # fusebpf v3: backing.c 三个 stage + dir.c 挂载点 + fuse_i.h io 结构 + 4 处 EEXIST 归一化
          for m in fuse_lookup_revalidate_initialize fuse_lookup_revalidate_backing \
                   fuse_lookup_revalidate_finalize; do
            grep -qF "$m" fs/fuse/backing.c || { echo "::error::fs/fuse/backing.c 缺少 $m"; exit 1; }
          done
          grep -qF 'fuse_bpf_backing(parent_inode,' fs/fuse/dir.c \
            || { echo '::error::fs/fuse/dir.c 缺少 fusebpf revalidate 挂载点'; exit 1; }
          grep -qF 'struct fuse_lookup_revalidate_io' fs/fuse/fuse_i.h \
            || { echo '::error::fs/fuse/fuse_i.h 缺少 fuse_lookup_revalidate_io'; exit 1; }
          EEXIST_CNT="$(grep -c 'if (err == -EEXIST)' fs/fuse/backing.c || true)"
          [ "$EEXIST_CNT" -ge 4 ] \
            || { echo "::error::fs/fuse/backing.c 只有 $EEXIST_CNT 处 EEXIST 归一化 (期望 4)"; exit 1; }
          # Unicode 绕过: ignore_init 已移除, 数据表缩到 64080
          if grep -qF 'ignore_init' fs/unicode/mkutf8data.c; then
            echo '::error::fs/unicode/mkutf8data.c 仍含 ignore_init (Unicode 绕过补丁未应用)'; exit 1
          fi
          grep -qF 'utf8data[64080]' fs/unicode/utf8data.c_shipped \
            || { echo '::error::fs/unicode/utf8data.c_shipped 数据表未按补丁变化'; exit 1; }
          echo "剩余 =m 配置项: $(grep -c '=m$' "$CONF" || true)"

      - name: 编译内核 Image
        shell: bash
        working-directory: gki-kernel/common
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_time }}" != 'N' ]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_time }}"
          fi
          export KBUILD_BUILD_USER=WGecy
          export KBUILD_BUILD_HOST=gki-ci
          [ -f "$CLANG_AUTOFDO_PROFILE" ] || { echo "::error::AFDO profile 缺失: $CLANG_AUTOFDO_PROFILE"; exit 1; }
          CUSTOM_SUFFIX="${{ inputs.custom_suffix }}"
          # 版本串完全来自 gki_defconfig 的 CONFIG_LOCALVERSION (patch 0002, 可选 custom_suffix 已在建 defconfig 时改写)。
          # 这里传空的 LOCALVERSION= : 既阻止 setlocalversion 追加 -g<sha>/-dirty, 又不会重复拼接版本串。
          make O=out ARCH=arm64 LLVM=1 LOCALVERSION= \
            KCFLAGS=-D__ANDROID_COMMON_KERNEL__ -j"$(nproc)" Image
          KREL="$(cat out/include/config/kernel.release)"
          echo "kernel.release = $KREL"
          EXPECTED="${{ inputs.kernel_version }}.${{ inputs.sub_level }}-android15-8${CUSTOM_SUFFIX}-4k"
          [ "$KREL" = "$EXPECTED" ] || { echo "::error::版本串不匹配: 期望 $EXPECTED 实际 $KREL"; exit 1; }
          {
            echo "KERNEL_IMAGE=$PWD/out/arch/arm64/boot/Image"
            echo "KERNEL_RELEASE=$KREL"
          } >> "$GITHUB_ENV"
          ls -lh out/arch/arm64/boot/Image

      - name: 校验产物 (KSU Built-In / SUSFS / ADIOS / fusebpf)
        shell: bash
        working-directory: gki-kernel/common
        run: |
          set -euo pipefail
          grep -q "$KERNEL_RELEASE" "$KERNEL_IMAGE" || { echo '::error::Image 内缺少版本串'; exit 1; }
          nm out/vmlinux | grep -q ' kernelsu_init' || { echo '::error::vmlinux 缺少 kernelsu_init'; exit 1; }
          grep -qF 'susfs is initialized' < <(strings out/vmlinux) || { echo '::error::vmlinux 缺少 SUSFS 初始化串'; exit 1; }
          # BakaSU Built-In: kernel/core/init.c 的启动串会写死 "Work mode: Built-in",
          # LKM 模式下同一句是 "Work mode: LKM" —— 用它确认驱动是真内建而不是别的形态。
          grep -qF 'Work mode: Built-in' < <(strings out/vmlinux) \
            || { echo '::error::vmlinux 缺少 BakaSU Built-In 启动串 (KSU 未以 =y 内建)'; exit 1; }
          echo 'BakaSU: Built-In 启动串已就绪'
          nm out/vmlinux | grep -q 'adios' || { echo '::error::vmlinux 中找不到任何 ADIOS 符号'; exit 1; }
          echo '产物校验通过'

      - name: 生成构建信息
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GKI_ROOT/dist"
          mkdir -p "$OUT"
          cp "$KERNEL_IMAGE" "$OUT/Image"
          cp "$GKI_ROOT/common/out/include/config/kernel.release" "$OUT/kernel.release"
          {
            echo "KERNEL_RELEASE=$KERNEL_RELEASE"
            echo "ANDROID_VERSION=${{ inputs.android_version }}"
            echo "KERNEL_VERSION=${{ inputs.kernel_version }}"
            echo "SUBLEVEL=${{ inputs.sub_level }}"
            echo "SNAPSHOT=${{ inputs.snapshot }}"
            echo "BASELINE_COMMIT=${{ inputs.baseline_commit }}"
            cat "$GKI_ROOT/ci-build-info.env"
            echo "BUILD_RUN=${{ github.run_number }}"
            echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$OUT/build-info.txt"
          cat "$OUT/build-info.txt"

      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          DIST="$GKI_ROOT/dist"
          AK3="$GITHUB_WORKSPACE/third_party/AnyKernel3"
          [ -d "$AK3" ] || { echo "::error::AnyKernel3 目录缺失: $AK3"; exit 1; }
          [ -f "${KERNEL_IMAGE:-}" ] || { echo "::error::内核镜像不存在: ${KERNEL_IMAGE:-未导出}"; exit 1; }
          # AnyKernel3 的 tools/ 是 ELF 可执行文件; 仓库里存成 644, 打包前必须补齐可执行位,
          # 否则刷入端 unzip 后拿到的是不可执行的 magiskboot/busybox。
          chmod -R 755 "$AK3/tools"
          chmod 755 "$AK3/META-INF/com/google/android/update-binary" "$AK3/anykernel.sh"
          ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.snapshot }}-AnyKernel3.zip"
          cp "$KERNEL_IMAGE" "$AK3/Image"
          rm -f "$DIST/$ZIP_NAME"
          ( cd "$AK3" && zip -q -r "$DIST/$ZIP_NAME" ./* )
          rm -f "$AK3/Image"
          [ -s "$DIST/$ZIP_NAME" ] || { echo "::error::AnyKernel3 打包失败"; exit 1; }
          unzip -l "$DIST/$ZIP_NAME" | tail -6
          ls -lh "$DIST/$ZIP_NAME"
          echo "AK3_ZIP=$DIST/$ZIP_NAME" >> "$GITHUB_ENV"

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.snapshot }}-${{ inputs.android_version }}
          path: |
            gki-kernel/dist/Image
            gki-kernel/dist/*.zip
            gki-kernel/dist/kernel.release
            gki-kernel/dist/build-info.txt
          if-no-files-found: error
          compression-level: 6
